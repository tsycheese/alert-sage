name: alert-sage

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alert_sage}
      POSTGRES_USER: ${POSTGRES_USER:-alert_sage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alert_sage}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      ALERT_SAGE_ENVIRONMENT: development
      ALERT_SAGE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-alert_sage}:${POSTGRES_PASSWORD:-alert_sage}@postgres:5432/${POSTGRES_DB:-alert_sage}
      ALERT_SAGE_REDIS_URL: redis://redis:6379/1
      ALERT_SAGE_CELERY_BROKER_URL: redis://redis:6379/0
      ALERT_SAGE_CORS_ORIGINS: '["http://localhost:${WEB_PORT:-5173}"]'
    command:
      - sh
      - -c
      - .venv/bin/alembic upgrade head && .venv/bin/python -m scripts.setup_checkpointer && .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    environment:
      ALERT_SAGE_ENVIRONMENT: development
      ALERT_SAGE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-alert_sage}:${POSTGRES_PASSWORD:-alert_sage}@postgres:5432/${POSTGRES_DB:-alert_sage}
      ALERT_SAGE_REDIS_URL: redis://redis:6379/1
      ALERT_SAGE_CELERY_BROKER_URL: redis://redis:6379/0
    command:
      - .venv/bin/celery
      - -A
      - app.tasks.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
