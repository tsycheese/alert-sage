name: alert-sage

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alert_sage}
      POSTGRES_USER: ${POSTGRES_USER:-alert_sage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alert_sage}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      ALERT_SAGE_ENVIRONMENT: development
      ALERT_SAGE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-alert_sage}:${POSTGRES_PASSWORD:-alert_sage}@postgres:5432/${POSTGRES_DB:-alert_sage}
      ALERT_SAGE_REDIS_URL: redis://redis:6379/1
      ALERT_SAGE_CELERY_BROKER_URL: redis://redis:6379/0
      ALERT_SAGE_METRICS_ENABLED: ${ALERT_SAGE_METRICS_ENABLED:-true}
      ALERT_SAGE_LOG_LEVEL: ${ALERT_SAGE_LOG_LEVEL:-INFO}
      ALERT_SAGE_CORS_ORIGINS: '["http://localhost:${WEB_PORT:-5173}"]'
      ALERT_SAGE_WORKFLOW_TOOL_TIMEOUT_SECONDS: ${ALERT_SAGE_WORKFLOW_TOOL_TIMEOUT_SECONDS:-10}
      ALERT_SAGE_CASE_SYNC_TIMEOUT_SECONDS: ${ALERT_SAGE_CASE_SYNC_TIMEOUT_SECONDS:-180}
      ALERT_SAGE_KNOWLEDGE_RETRIEVAL_TIMEOUT_SECONDS: ${ALERT_SAGE_KNOWLEDGE_RETRIEVAL_TIMEOUT_SECONDS:-15}
      ALERT_SAGE_KNOWLEDGE_PROVIDER: ${ALERT_SAGE_KNOWLEDGE_PROVIDER:-mock}
      ALERT_SAGE_DIFY_BASE_URL: ${ALERT_SAGE_DIFY_BASE_URL:-https://api.dify.ai/v1}
      ALERT_SAGE_DIFY_DATASET_ID: ${ALERT_SAGE_DIFY_DATASET_ID:-}
      ALERT_SAGE_DIFY_API_KEY: ${ALERT_SAGE_DIFY_API_KEY:-}
      ALERT_SAGE_DIFY_HTTP_TIMEOUT_SECONDS: ${ALERT_SAGE_DIFY_HTTP_TIMEOUT_SECONDS:-15}
      ALERT_SAGE_DIFY_POLL_INTERVAL_SECONDS: ${ALERT_SAGE_DIFY_POLL_INTERVAL_SECONDS:-2}
      ALERT_SAGE_DIFY_MAX_RETRIES: ${ALERT_SAGE_DIFY_MAX_RETRIES:-2}
      ALERT_SAGE_DIAGNOSTIC_MODEL_PROVIDER: ${ALERT_SAGE_DIAGNOSTIC_MODEL_PROVIDER:-mock}
      ALERT_SAGE_DIAGNOSTIC_MODEL_BASE_URL: ${ALERT_SAGE_DIAGNOSTIC_MODEL_BASE_URL:-https://api.deepseek.com}
      ALERT_SAGE_DIAGNOSTIC_MODEL_API_KEY: ${ALERT_SAGE_DIAGNOSTIC_MODEL_API_KEY:-}
      ALERT_SAGE_DIAGNOSTIC_MODEL_NAME: ${ALERT_SAGE_DIAGNOSTIC_MODEL_NAME:-deepseek-v4-flash}
      ALERT_SAGE_DIAGNOSTIC_MODEL_TIMEOUT_SECONDS: ${ALERT_SAGE_DIAGNOSTIC_MODEL_TIMEOUT_SECONDS:-60}
      ALERT_SAGE_DIAGNOSTIC_MODEL_MAX_RETRIES: ${ALERT_SAGE_DIAGNOSTIC_MODEL_MAX_RETRIES:-2}
      ALERT_SAGE_DIAGNOSTIC_MODEL_MAX_TOKENS: ${ALERT_SAGE_DIAGNOSTIC_MODEL_MAX_TOKENS:-3000}
      ALERT_SAGE_DIAGNOSTIC_MODEL_TEMPERATURE: ${ALERT_SAGE_DIAGNOSTIC_MODEL_TEMPERATURE:-0.1}
      ALERT_SAGE_DIAGNOSTIC_MODEL_THINKING_ENABLED: ${ALERT_SAGE_DIAGNOSTIC_MODEL_THINKING_ENABLED:-false}
    command:
      - sh
      - -c
      - .venv/bin/alembic upgrade head && .venv/bin/python -m scripts.setup_checkpointer && .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    environment:
      ALERT_SAGE_ENVIRONMENT: development
      ALERT_SAGE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-alert_sage}:${POSTGRES_PASSWORD:-alert_sage}@postgres:5432/${POSTGRES_DB:-alert_sage}
      ALERT_SAGE_REDIS_URL: redis://redis:6379/1
      ALERT_SAGE_CELERY_BROKER_URL: redis://redis:6379/0
      ALERT_SAGE_METRICS_ENABLED: ${ALERT_SAGE_METRICS_ENABLED:-true}
      ALERT_SAGE_LOG_LEVEL: ${ALERT_SAGE_LOG_LEVEL:-INFO}
      ALERT_SAGE_CELERY_LOG_SERVICE: alert-sage-worker
      ALERT_SAGE_OUTBOX_BATCH_SIZE: ${ALERT_SAGE_OUTBOX_BATCH_SIZE:-50}
      ALERT_SAGE_OUTBOX_RETRY_BASE_SECONDS: ${ALERT_SAGE_OUTBOX_RETRY_BASE_SECONDS:-2}
      ALERT_SAGE_OUTBOX_RETRY_MAX_SECONDS: ${ALERT_SAGE_OUTBOX_RETRY_MAX_SECONDS:-60}
      ALERT_SAGE_WORKER_METRICS_PORT: 9101
      PROMETHEUS_MULTIPROC_DIR: /tmp/alert-sage-prometheus
      ALERT_SAGE_WORKFLOW_TOOL_TIMEOUT_SECONDS: ${ALERT_SAGE_WORKFLOW_TOOL_TIMEOUT_SECONDS:-10}
      ALERT_SAGE_CASE_SYNC_TIMEOUT_SECONDS: ${ALERT_SAGE_CASE_SYNC_TIMEOUT_SECONDS:-180}
      ALERT_SAGE_KNOWLEDGE_RETRIEVAL_TIMEOUT_SECONDS: ${ALERT_SAGE_KNOWLEDGE_RETRIEVAL_TIMEOUT_SECONDS:-15}
      ALERT_SAGE_KNOWLEDGE_PROVIDER: ${ALERT_SAGE_KNOWLEDGE_PROVIDER:-mock}
      ALERT_SAGE_DIFY_BASE_URL: ${ALERT_SAGE_DIFY_BASE_URL:-https://api.dify.ai/v1}
      ALERT_SAGE_DIFY_DATASET_ID: ${ALERT_SAGE_DIFY_DATASET_ID:-}
      ALERT_SAGE_DIFY_API_KEY: ${ALERT_SAGE_DIFY_API_KEY:-}
      ALERT_SAGE_DIFY_HTTP_TIMEOUT_SECONDS: ${ALERT_SAGE_DIFY_HTTP_TIMEOUT_SECONDS:-15}
      ALERT_SAGE_DIFY_POLL_INTERVAL_SECONDS: ${ALERT_SAGE_DIFY_POLL_INTERVAL_SECONDS:-2}
      ALERT_SAGE_DIFY_MAX_RETRIES: ${ALERT_SAGE_DIFY_MAX_RETRIES:-2}
      ALERT_SAGE_DIAGNOSTIC_MODEL_PROVIDER: ${ALERT_SAGE_DIAGNOSTIC_MODEL_PROVIDER:-mock}
      ALERT_SAGE_DIAGNOSTIC_MODEL_BASE_URL: ${ALERT_SAGE_DIAGNOSTIC_MODEL_BASE_URL:-https://api.deepseek.com}
      ALERT_SAGE_DIAGNOSTIC_MODEL_API_KEY: ${ALERT_SAGE_DIAGNOSTIC_MODEL_API_KEY:-}
      ALERT_SAGE_DIAGNOSTIC_MODEL_NAME: ${ALERT_SAGE_DIAGNOSTIC_MODEL_NAME:-deepseek-v4-flash}
      ALERT_SAGE_DIAGNOSTIC_MODEL_TIMEOUT_SECONDS: ${ALERT_SAGE_DIAGNOSTIC_MODEL_TIMEOUT_SECONDS:-60}
      ALERT_SAGE_DIAGNOSTIC_MODEL_MAX_RETRIES: ${ALERT_SAGE_DIAGNOSTIC_MODEL_MAX_RETRIES:-2}
      ALERT_SAGE_DIAGNOSTIC_MODEL_MAX_TOKENS: ${ALERT_SAGE_DIAGNOSTIC_MODEL_MAX_TOKENS:-3000}
      ALERT_SAGE_DIAGNOSTIC_MODEL_TEMPERATURE: ${ALERT_SAGE_DIAGNOSTIC_MODEL_TEMPERATURE:-0.1}
      ALERT_SAGE_DIAGNOSTIC_MODEL_THINKING_ENABLED: ${ALERT_SAGE_DIAGNOSTIC_MODEL_THINKING_ENABLED:-false}
    command: [".venv/bin/python", "-m", "scripts.run_worker"]
    ports:
      - "${WORKER_METRICS_PORT:-19101}:9101"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  relay:
    build:
      context: ./backend
    environment:
      ALERT_SAGE_ENVIRONMENT: development
      ALERT_SAGE_CELERY_BROKER_URL: redis://redis:6379/0
      ALERT_SAGE_CELERY_LOG_SERVICE: alert-sage-relay
      ALERT_SAGE_LOG_LEVEL: ${ALERT_SAGE_LOG_LEVEL:-INFO}
      ALERT_SAGE_OUTBOX_POLL_INTERVAL_SECONDS: ${ALERT_SAGE_OUTBOX_POLL_INTERVAL_SECONDS:-5}
    command:
      - .venv/bin/celery
      - -A
      - app.tasks.celery_app:celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/alert-sage-celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.12.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "${PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_started
      worker:
        condition: service_started

  grafana:
    image: grafana/grafana:13.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    ports:
      - "${GRAFANA_PORT:-13000}:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
